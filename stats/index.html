<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Arnimaz21/arnimaz21.github.io/main/assets/icon/Arnimaz21-Head.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Шрифты Space Grotesk и JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #070b10;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(11, 16, 23, 0.6);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #1b282e;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #00f5a0;
    }
    .text-outline-black {
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0px  2px 4px rgba(0, 0, 0, 0.9);
    }
    .skin-head {
      image-rendering: pixelated;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 antialiased select-none relative bg-[#070b10]">

  <!-- Живой WebGL Canvas фон -->
  <div class="fixed inset-0 w-full h-full pointer-events-none -z-10">
    <canvas id="shader-canvas" class="w-full h-full block"></canvas>
  </div>

  <div class="max-w-6xl w-full mx-auto space-y-5 pb-12 relative z-10 flex-1">
    
    <!-- Шапка -->
    <div class="border border-[#00f5a0]/25 bg-[#0b1017]/90 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4 shadow-lg">
      <div class="flex items-center gap-4">
        <div class="p-3 bg-[#131c26] text-[#00f5a0] border border-[#00f5a0]/40 rounded-xl flex items-center justify-center">
          <i data-lucide="server" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="font-bold text-white tracking-wide text-base font-sans flex items-center gap-2">
            Cloud.Mine
          </div>
          <div class="text-xs text-gray-400 mt-1 font-mono flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#00f5a0] animate-pulse"></span>
            Minecraft Paper 26.3
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="btnRefresh" class="px-4 py-2 bg-[#121a22] hover:bg-[#18232e] text-xs font-semibold text-gray-200 border border-[#00f5a0]/30 hover:border-[#00f5a0]/60 rounded-xl flex items-center gap-2 transition duration-200 shadow-sm">
          <i data-lucide="rotate-cw" id="refreshIcon" class="w-3.5 h-3.5 text-[#00f5a0]"></i>
          <span class="font-sans">Обновить</span>
        </button>

        <div class="px-3.5 py-2 bg-[#121a22] border border-white/10 rounded-xl flex items-center gap-2 text-xs font-mono text-gray-300">
          <span class="w-2 h-2 rounded-full bg-[#00f5a0]" id="timerDot"></span>
          <span>Авто: <span id="timerCountdown" class="text-[#00f5a0]">10s</span></span>
          <button id="btnToggleTimer" class="hover:text-white transition ml-1">
            <i data-lucide="pause" id="timerIcon" class="w-3 h-3"></i>
          </button>
        </div>

        <a href="/" class="px-4 py-2 bg-[#121a22] hover:bg-[#18232e] text-xs font-semibold text-gray-200 border border-white/10 hover:border-white/20 rounded-xl flex items-center gap-2 transition duration-200">
          <i data-lucide="box" class="w-3.5 h-3.5 text-[#00f5a0]"></i>
          <span class="font-sans">.mrpack Конвертер</span>
        </a>

        <a href="https://discord.gg/kQkRgbFZeK" target="_blank" rel="noopener" class="px-4 py-2 bg-[#5865F2]/20 hover:bg-[#5865F2]/30 text-xs font-semibold text-indigo-200 border border-[#5865F2]/40 rounded-xl flex items-center gap-2 transition">
          <i data-lucide="disc" class="w-3.5 h-3.5 text-[#5865F2]"></i>
          <span class="font-sans">Discord</span>
        </a>
      </div>
    </div>

    <!-- Метрики онлайна и игроков -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-[#0e151d]/90 border border-[#00f5a0]/30 p-5 rounded-2xl relative overflow-hidden shadow-sm flex items-center justify-between">
        <div>
          <span class="text-gray-400 block text-[11px] font-semibold uppercase tracking-wider font-mono mb-2">ОНЛАЙН СЕЙЧАС</span>
          <div class="text-3xl font-bold text-white font-mono flex items-baseline gap-2">
            <span id="statOnline" class="text-white">0</span>
            <span class="text-gray-500 text-lg">/ <span id="statMax">20</span></span>
          </div>
        </div>
        <div class="w-3 h-3 rounded-full bg-[#00f5a0] shadow-[0_0_12px_#00f5a0]" id="onlinePulseDot"></div>
      </div>

      <div class="bg-[#0e151d]/90 border border-white/10 p-5 rounded-2xl relative overflow-hidden shadow-sm flex items-center justify-between">
        <div>
          <span class="text-gray-400 block text-[11px] font-semibold uppercase tracking-wider font-mono mb-2">ИГРОКОВ В Б.Д.</span>
          <div class="text-3xl font-bold text-white font-mono">
            <span id="statDbCount">0</span>
          </div>
        </div>
        <i data-lucide="users" class="w-6 h-6 text-gray-500"></i>
      </div>
    </div>

    <!-- Основной контент: Список игроков и Журнал событий -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      
      <!-- Колонка: Игроки сервера -->
      <div class="lg:col-span-2 border border-white/10 bg-[#0b1017]/90 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between">
        <div>
          <div class="p-4 border-b border-white/10 bg-[#070b10]/90 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-2 text-sm font-bold text-white font-sans">
              <i data-lucide="swords" class="w-4 h-4 text-[#00f5a0]"></i>
              <span>Игроки сервера</span>
              <span id="badgePlayerTotal" class="text-[11px] px-2 py-0.5 rounded-full bg-[#00f5a0]/15 text-[#00f5a0] border border-[#00f5a0]/30 font-mono">0</span>
            </div>

            <!-- Фильтры -->
            <div class="flex gap-1.5 bg-[#070b10] p-1 rounded-xl border border-white/10 font-mono">
              <button class="px-3 py-1 text-[11px] text-[#00f5a0] font-semibold border-b-2 border-[#00f5a0] transition" id="filterAll">Все</button>
              <button class="px-3 py-1 text-[11px] text-gray-400 hover:text-white transition" id="filterOnline">В сети</button>
              <button class="px-3 py-1 text-[11px] text-gray-400 hover:text-white transition" id="filterOffline">Оффлайн</button>
            </div>
          </div>

          <!-- Список игроков -->
          <div class="p-4 space-y-3 min-h-[360px] max-h-[500px] overflow-y-auto custom-scroll" id="playersContainer">
            <div class="h-64 flex flex-col items-center justify-center text-gray-500 text-xs font-mono gap-2">
              <i data-lucide="user-x" class="w-8 h-8 opacity-40"></i>
              <span>Нет игроков в базе</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Колонка: Журнал событий -->
      <div class="border border-white/10 bg-[#0b1017]/90 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between">
        <div>
          <div class="p-4 border-b border-white/10 bg-[#070b10]/90 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 text-sm font-bold text-white font-sans">
              <i data-lucide="activity" class="w-4 h-4 text-[#00f5a0]"></i>
              <span>Журнал событий</span>
            </div>
          </div>

          <div class="p-4 space-y-2.5 min-h-[360px] max-h-[500px] overflow-y-auto custom-scroll" id="eventsContainer">
            <div class="h-64 flex flex-col items-center justify-center text-gray-500 text-xs font-mono gap-2">
              <i data-lucide="clock" class="w-8 h-8 opacity-40"></i>
              <span>Событий пока нет</span>
            </div>
          </div>
        </div>

        <!-- Подвал журнала: время синхронизации строго справа -->
        <div class="p-3.5 border-t border-white/10 bg-[#070b10]/90 text-[11px] font-mono flex items-center justify-end text-gray-400">
          <span id="syncTime">Синхр: --:--:--</span>
        </div>
      </div>

    </div>

  </div>

  <!-- Авторская подпись -->
  <div class="text-center py-4 text-xs font-mono tracking-wider select-none relative z-10 text-outline-black">
    <span class="text-gray-300">by Arnimaz21 for </span>
    <a href="https://discord.gg/kQkRgbFZeK" target="_blank" rel="noopener" class="text-indigo-400 hover:text-indigo-300 transition inline-flex items-center gap-1">
      vunya100's server
      <i data-lucide="disc" class="w-3 h-3 inline-block"></i>
    </a>
  </div>

  <!-- JavaScript приложения -->
  <script>
    lucide.createIcons();

    const WORKER_ENDPOINT = "https://cloud-stats.arnimaz27.workers.dev/update";

    let state = {
      online: 0,
      max: 20,
      totalPlayersCount: 0,
      players: {},
      events: [],
      filter: 'all',
      isTimerActive: true,
      countdown: 10
    };

    const DOM = {
      statOnline: document.getElementById('statOnline'),
      statMax: document.getElementById('statMax'),
      statDbCount: document.getElementById('statDbCount'),
      badgePlayerTotal: document.getElementById('badgePlayerTotal'),
      playersContainer: document.getElementById('playersContainer'),
      eventsContainer: document.getElementById('eventsContainer'),
      syncTime: document.getElementById('syncTime'),
      btnRefresh: document.getElementById('btnRefresh'),
      refreshIcon: document.getElementById('refreshIcon'),
      timerCountdown: document.getElementById('timerCountdown'),
      btnToggleTimer: document.getElementById('btnToggleTimer'),
      timerIcon: document.getElementById('timerIcon'),
      filterAll: document.getElementById('filterAll'),
      filterOnline: document.getElementById('filterOnline'),
      filterOffline: document.getElementById('filterOffline')
    };

    // Загрузка скина игрока
    function getSkinUrl(username) {
      if (!username) return 'https://minotar.net/helm/Steve/64.png';
      if (username.toLowerCase() === 'arnimaz21') {
        return 'https://raw.githubusercontent.com/Arnimaz21/arnimaz21.github.io/main/assets/icon/Arnimaz21-Head.png';
      }
      return `https://minotar.net/helm/${encodeURIComponent(username)}/64.png`;
    }

    function formatTime(minutes) {
      if (!minutes || minutes <= 0) return 'Меньше минуты';
      const m = Math.floor(minutes);
      if (m < 60) return `${m} мин`;
      const h = Math.floor(m / 60);
      const remM = m % 60;
      return remM > 0 ? `${h} ч ${remM} мин` : `${h} ч`;
    }

    function formatRelativeDate(isoStr) {
      if (!isoStr) return 'Неизвестно';
      try {
        const d = new Date(isoStr);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (e) {
        return isoStr;
      }
    }

    // Запрос данных с Cloudflare Worker
    async function fetchStats() {
      DOM.refreshIcon.classList.add('animate-spin');
      try {
        const res = await fetch(WORKER_ENDPOINT, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        state.online = typeof data.online === 'number' ? data.online : 0;
        state.max = typeof data.max === 'number' ? data.max : 20;

        // Защита от случайного сброса базы: если с сервера пришел пустой players, сохраняем локально известных
        if (data.players && Object.keys(data.players).length > 0) {
          state.players = data.players;
          state.totalPlayersCount = Object.keys(data.players).length;
        } else if (typeof data.totalPlayersCount === 'number' && data.totalPlayersCount > 0) {
          state.totalPlayersCount = data.totalPlayersCount;
        }

        if (Array.isArray(data.events) && data.events.length > 0) {
          state.events = data.events;
        }

        const now = new Date();
        DOM.syncTime.innerText = `Синхр: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

        renderUI();
      } catch (err) {
        console.error("Fetch stats error:", err);
      } finally {
        DOM.refreshIcon.classList.remove('animate-spin');
      }
    }

    function renderUI() {
      DOM.statOnline.innerText = state.online;
      DOM.statMax.innerText = state.max;
      DOM.statDbCount.innerText = state.totalPlayersCount || Object.keys(state.players).length;
      DOM.badgePlayerTotal.innerText = state.totalPlayersCount || Object.keys(state.players).length;

      renderPlayers();
      renderEvents();
      lucide.createIcons();
    }

    function renderPlayers() {
      const playerList = Object.values(state.players || {});
      
      const filtered = playerList.filter(p => {
        if (state.filter === 'online') return p.isOnline;
        if (state.filter === 'offline') return !p.isOnline;
        return true;
      });

      if (filtered.length === 0) {
        DOM.playersContainer.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-gray-500 text-xs font-mono gap-2">
            <i data-lucide="user-x" class="w-8 h-8 opacity-40"></i>
            <span>${playerList.length === 0 ? 'Нет игроков в базе' : 'Никого не найдено по фильтру'}</span>
          </div>`;
        return;
      }

      // Сортировка: сначала онлайн, затем по времени последнего визита
      filtered.sort((a, b) => {
        if (a.isOnline && !b.isOnline) return -1;
        if (!a.isOnline && b.isOnline) return 1;
        return new Date(b.lastSeen || 0) - new Date(a.lastSeen || 0);
      });

      let html = '';
      filtered.forEach(p => {
        const isOnline = Boolean(p.isOnline);
        const statusBadge = isOnline
          ? `<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-[#00f5a0]/15 text-[#00f5a0] border border-[#00f5a0]/30 font-mono">В ИГРЕ</span>`
          : `<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-gray-800/80 text-gray-400 border border-white/10 font-mono">ОФФЛАЙН</span>`;

        let liveSessionMins = 0;
        if (isOnline && p.sessionStart) {
          liveSessionMins = Math.max(0, Math.floor((Date.now() - new Date(p.sessionStart).getTime()) / 60000));
        }
        const totalMinutes = (p.totalTimeMinutes || 0) + liveSessionMins;
        const timePlayedStr = formatTime(totalMinutes);

        html += `
          <div class="p-3.5 rounded-xl bg-[#0e151d] border ${isOnline ? 'border-[#00f5a0]/40 shadow-[0_0_15px_rgba(0,245,160,0.06)]' : 'border-white/5'} flex items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 overflow-hidden">
              <div class="relative w-11 h-11 rounded-lg overflow-hidden bg-[#131c26] border border-white/10 flex-shrink-0">
                <img src="${getSkinUrl(p.name)}" alt="${p.name}" class="w-full h-full object-cover skin-head"
                     onerror="this.src='https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/64'; this.onerror=null;">
                ${isOnline ? '<span class="absolute bottom-1 right-1 w-2.5 h-2.5 rounded-full bg-[#00f5a0] ring-2 ring-[#0e151d]"></span>' : ''}
              </div>
              <div class="truncate">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-white text-sm font-sans tracking-wide">${p.name}</span>
                  ${statusBadge}
                </div>
                <div class="text-[11px] text-gray-400 font-mono mt-0.5">
                  ${isOnline ? '<span class="text-[#00f5a0]">▶ В игре сейчас</span>' : `Был: ${formatRelativeDate(p.lastSeen)}`}
                </div>
              </div>
            </div>

            <div class="text-right flex-shrink-0 font-mono">
              <div class="text-[10px] text-gray-500 uppercase tracking-wider">Наигpaнo:</div>
              <div class="text-xs font-bold text-gray-200 mt-0.5">${timePlayedStr}</div>
            </div>
          </div>`;
      });

      DOM.playersContainer.innerHTML = html;
    }

    function renderEvents() {
      if (!state.events || state.events.length === 0) {
        DOM.eventsContainer.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-gray-500 text-xs font-mono gap-2">
            <i data-lucide="clock" class="w-8 h-8 opacity-40"></i>
            <span>Событий пока нет</span>
          </div>`;
        return;
      }

      let html = '';
      state.events.slice(0, 30).forEach(ev => {
        const isJoin = ev.type === 'join';
        const icon = isJoin ? '<span class="text-[#00f5a0] font-bold">[+]</span>' : '<span class="text-red-400 font-bold">[-]</span>';
        const actionText = isJoin ? 'зашёл на сервер' : 'покинул сервер';
        const timeStr = formatRelativeDate(ev.time);

        html += `
          <div class="p-2.5 rounded-xl bg-[#0e151d] border border-white/5 flex items-center justify-between text-xs font-mono">
            <div class="flex items-center gap-2.5 truncate mr-2">
              <img src="${getSkinUrl(ev.player)}" class="w-6 h-6 rounded bg-[#131c26] flex-shrink-0 skin-head"
                   onerror="this.src='https://mc-heads.net/avatar/${encodeURIComponent(ev.player)}/32'; this.onerror=null;">
              <span class="truncate">
                ${icon} <span class="text-white font-medium">${ev.player}</span>
                <span class="text-gray-400 text-[11px]">${actionText}</span>
              </span>
            </div>
            <span class="text-[10px] text-gray-500 flex-shrink-0">${timeStr}</span>
          </div>`;
      });

      DOM.eventsContainer.innerHTML = html;
    }

    // Слушатели фильтров
    function setFilter(filter) {
      state.filter = filter;
      [DOM.filterAll, DOM.filterOnline, DOM.filterOffline].forEach(b => {
        b.className = "px-3 py-1 text-[11px] text-gray-400 hover:text-white transition";
      });
      if (filter === 'all') DOM.filterAll.className = "px-3 py-1 text-[11px] text-[#00f5a0] font-semibold border-b-2 border-[#00f5a0] transition";
      if (filter === 'online') DOM.filterOnline.className = "px-3 py-1 text-[11px] text-[#00f5a0] font-semibold border-b-2 border-[#00f5a0] transition";
      if (filter === 'offline') DOM.filterOffline.className = "px-3 py-1 text-[11px] text-[#00f5a0] font-semibold border-b-2 border-[#00f5a0] transition";
      renderPlayers();
      lucide.createIcons();
    }

    DOM.filterAll.addEventListener('click', () => setFilter('all'));
    DOM.filterOnline.addEventListener('click', () => setFilter('online'));
    DOM.filterOffline.addEventListener('click', () => setFilter('offline'));
    DOM.btnRefresh.addEventListener('click', fetchStats);

    // Таймер автообновления
    DOM.btnToggleTimer.addEventListener('click', () => {
      state.isTimerActive = !state.isTimerActive;
      DOM.timerIcon.setAttribute('data-lucide', state.isTimerActive ? 'pause' : 'play');
      lucide.createIcons();
    });

    setInterval(() => {
      if (!state.isTimerActive) return;
      state.countdown--;
      if (state.countdown <= 0) {
        state.countdown = 10;
        fetchStats();
      }
      DOM.timerCountdown.innerText = `${state.countdown}s`;
    }, 1000);

    // WebGL Shader Background
    (function initShader() {
      const canvas = document.getElementById('shader-canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return;

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
      }
      window.addEventListener('resize', resize);
      resize();

      const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
      const fs = `
        precision mediump float;
        uniform float t;
        uniform vec2 r;
        void main() {
          vec2 uv = gl_FragCoord.xy / r.xy;
          vec2 p = (gl_FragCoord.xy * 2.0 - r.xy) / min(r.x, r.y);
          
          float wave = sin(p.y * 3.0 + sin(p.x * 2.0 + t * 0.4) * 1.5 + t * 0.3) * 0.5 + 0.5;
          wave += sin(p.x * 1.5 - t * 0.2) * 0.25;

          // Темно-зеленая изумрудная палитра
          vec3 darkVoid = vec3(0.015, 0.03, 0.025);
          vec3 emerald = vec3(0.0, 0.96, 0.62);
          vec3 deepCyan = vec3(0.02, 0.22, 0.18);

          vec3 color = mix(darkVoid, deepCyan, wave * 0.55);
          color += emerald * pow(wave, 4.0) * 0.35;

          // Легкая сетка
          vec2 grid = abs(fract(gl_FragCoord.xy / 48.0) - 0.5);
          float line = 1.0 - smoothstep(0.0, 0.04, min(grid.x, grid.y));
          color += emerald * line * 0.035;

          gl_FragColor = vec4(color, 1.0);
        }
      `;

      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const pos = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(pos);
      gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

      const uT = gl.getUniformLocation(prog, 't');
      const uR = gl.getUniformLocation(prog, 'r');

      let start = performance.now();
      function render() {
        const now = (performance.now() - start) * 0.001;
        gl.uniform1f(uT, now);
        gl.uniform2f(uR, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render();
    })();

    // Первоначальный запрос данных
    fetchStats();
  </script>
</body>
</html>
