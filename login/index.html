<img alt="Стив" class="w-full h-full rounded-lg" id="avatarPreview" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/Arnimaz21/arnimaz21.github.io/main/assets/skins/steave.png'; const dot = document.getElementById('skinStatusDot'); if (dot) { dot.className = 'w-1.5 h-1.5 rounded-full bg-red-400'; } const n = document.getElementById('skinSourceNotice'); if (n) { n.innerText = 'Скин не найден'; n.className = 'text-[11px] text-red-400 font-mono'; }" src="https://raw.githubusercontent.com/Arnimaz21/arnimaz21.github.io/main/assets/skins/steave.png" style="image-rendering: pixelated; object-fit: cover;">

<div>

              Пароль доступа <span class="text-[#00f5a0]">*</span>
</label>

<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="key-round" aria-hidden="true" class="lucide lucide-key-round w-4 h-4"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>
</div>
<input autocomplete="current-password" class="w-full bg-[#0e1622] text-white pl-9 pr-10 py-2.5 text-xs font-mono rounded-xl border border-white/10 focus:border-[#00f5a0] focus:ring-1 focus:ring-[#00f5a0] outline-none transition placeholder-gray-600 shadow-inner" id="inputPassword" placeholder="Введите пароль учётной записи" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-200 focus:outline-none" id="togglePasswordBtn" type="button">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" aria-hidden="true" class="lucide lucide-eye w-4 h-4" id="eyeIcon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>
<!-- Сообщение об ошибке/успехе -->

<!-- Кнопка входа -->
<button class="w-full py-3 px-4 bg-[#00f5a0] hover:bg-[#50ffaf] text-[#002111] font-bold text-xs tracking-wider rounded-xl font-sans flex items-center justify-center gap-2.5 transition duration-200 neon-btn-glow disabled:opacity-50 disabled:pointer-events-none cursor-pointer" id="btnSubmit" type="submit" style="margin-top: 84px;">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="log-in" aria-hidden="true" class="lucide lucide-log-in w-4 h-4"><path d="m10 17 5-5-5-5"></path><path d="M15 12H3"></path><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></svg>
<span class="" id="btnSubmitText">ВОЙТИ В СИСТЕМУ</span>

<!-- Фирменная подпись проекта с чёрным контуром -->
<div class="text-center py-4 text-xs font-mono tracking-wider select-none relative z-10 text-outline-black"><span class="text-gray-300">by Arnimaz21 for </span><a class="text-indigo-400 hover:text-indigo-300 transition inline-flex items-center gap-1" href="https://discord.gg/kQkRgbFZeK" rel="noopener" target="_blank"><span class="">vunya100's server</span><svg class="w-3.5 h-3.5 fill-current text-[#5865F2] inline-block" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"></path></svg></a></div>
<script>
    lucide.createIcons();

    const CF_WORKER_USERS_URL = "https://cloud-stats.arnimaz27.workers.dev/users";
    const TARGET_REDIRECT_URL = "https://arnimaz21.github.io/";
    const STEVE_FALLBACK_URL = "https://raw.githubusercontent.com/Arnimaz21/arnimaz21.github.io/main/assets/skins/steave.png";

    const inputUsername = document.getElementById('inputUsername');
    const inputPassword = document.getElementById('inputPassword');
    const avatarPreview = document.getElementById('avatarPreview');
    const usernamePreviewText = document.getElementById('usernamePreviewText');
    const skinSourceNotice = document.getElementById('skinSourceNotice');
    const skinStatusDot = document.getElementById('skinStatusDot');
    const loginAlert = document.getElementById('loginAlert');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSubmitText = document.getElementById('btnSubmitText');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    // Переключение видимости пароля
    togglePasswordBtn.addEventListener('click', () => {
      const isPass = inputPassword.type === 'password';
      inputPassword.type = isPass ? 'text' : 'password';
      eyeIcon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
      lucide.createIcons();
    });

    // Динамический предпросмотр скина из репозитория
    let debounceTimer;
    inputUsername.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const nick = inputUsername.value.trim();

      if (!nick) {
        avatarPreview.src = STEVE_FALLBACK_URL;
        usernamePreviewText.innerText = "Стив";
        skinSourceNotice.innerText = "Ожидание ввода ника...";
        skinSourceNotice.className = "text-[11px] text-gray-500 font-mono";
        if (skinStatusDot) {
          skinStatusDot.className = "w-1.5 h-1.5 rounded-full bg-gray-500";
        }
        return;
      }

      usernamePreviewText.innerText = nick;
      skinSourceNotice.innerText = "Поиск скина в репозитории...";
      skinSourceNotice.className = "text-[11px] text-gray-400 font-mono";
      if (skinStatusDot) {
        skinStatusDot.className = "w-1.5 h-1.5 rounded-full bg-yellow-500 animate-pulse";
      }

      debounceTimer = setTimeout(() => {
        const repoSkinUrl = `https://raw.githubusercontent.com/Arnimaz21/arnimaz21.github.io/main/assets/skins/${nick}.png`;
        
        // Проверяем наличие скина
        const testImg = new Image();
        testImg.onload = () => {
          avatarPreview.src = repoSkinUrl;
          skinSourceNotice.innerText = "Скин найден";
          skinSourceNotice.className = "text-[11px] text-[#00f5a0] font-mono";
          if (skinStatusDot) {
            skinStatusDot.className = "w-1.5 h-1.5 rounded-full bg-[#00f5a0]";
          }
        };
        testImg.onerror = () => {
          avatarPreview.src = STEVE_FALLBACK_URL;
          skinSourceNotice.innerText = "Скин не найден";
          skinSourceNotice.className = "text-[11px] text-gray-500 font-mono";
          if (skinStatusDot) {
            skinStatusDot.className = "w-1.5 h-1.5 rounded-full bg-gray-500";
          }
        };
        testImg.src = repoSkinUrl;
      }, 350);
    });

    // Обработка авторизации
    async function handleLogin() {
      const username = inputUsername.value.trim();
      const password = inputPassword.value;

      if (!username || !password) {
        showAlert('Пожалуйста, заполните никнейм и пароль!', 'error');
        return;
      }

      // Блокируем кнопку на время проверки
      btnSubmit.disabled = true;
      btnSubmitText.innerText = 'ПРОВЕРКА ДОСТУПА...';
      showAlert('Подключение к базе данных Cloudflare KV...', 'info');

      try {
        const res = await fetch(CF_WORKER_USERS_URL, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
            'Cache-Control': 'no-cache'
          }
        });

        if (!res.ok) {
          throw new Error(`Ошибка соединения с сервером базы данных (HTTP ${res.status})`);
        }

        const data = await res.json();
        const users = Array.isArray(data.users) ? data.users : (Array.isArray(data) ? data : []);

        // Ищем пользователя с учётом регистра никнейма
        const user = users.find(u => 
          (u.username && u.username.toLowerCase() === username.toLowerCase()) || 
          (u.name && u.name.toLowerCase() === username.toLowerCase())
        );

        if (!user) {
          showAlert('Ошибка: игрок с таким ником не зарегистрирован в системе!', 'error');
          btnSubmit.disabled = false;
          btnSubmitText.innerText = 'ВОЙТИ В СИСТЕМУ';
          return;
        }

        // Проверяем пароль
        if (user.password !== password) {
          showAlert('Неверный пароль доступа! Проверьте правильность ввода.', 'error');
          btnSubmit.disabled = false;
          btnSubmitText.innerText = 'ВОЙТИ В СИСТЕМУ';
          return;
        }

        // Авторизация успешна! Всегда сохраняем сессию по умолчанию
        const sessionPayload = {
          id: user.id || `usr_${Date.now()}`,
          username: user.username || user.name,
          role: user.role || 'player',
          authTime: new Date().toISOString(),
          skinUrl: avatarPreview.src
        };

        localStorage.setItem('cloud_mine_auth_session', JSON.stringify(sessionPayload));
        localStorage.setItem('cloud_mine_user', sessionPayload.username);
        localStorage.setItem('cloud_mine_role', sessionPayload.role);

        // Также дублируем в cookie на 30 дней для совместимости
        document.cookie = `cloud_mine_user=${encodeURIComponent(sessionPayload.username)}; path=/; max-age=2592000; SameSite=Lax`;
        document.cookie = `cloud_mine_role=${encodeURIComponent(sessionPayload.role)}; path=/; max-age=2592000; SameSite=Lax`;

        showAlert(`Успешный вход! Добро пожаловать, ${sessionPayload.username}. Перенаправление...`, 'success');
        btnSubmitText.innerText = 'ПЕРЕНАПРАВЛЕНИЕ...';

        // Мгновенный редирект на главный сайт
        setTimeout(() => {
          window.location.href = TARGET_REDIRECT_URL;
        }, 600);

      } catch (err) {
        console.error('Ошибка входа:', err);
        showAlert(`Не удалось выполнить вход: ${err.message}`, 'error');
        btnSubmit.disabled = false;
        btnSubmitText.innerText = 'ВОЙТИ В СИСТЕМУ';
      }
    }

    function showAlert(msg, type) {
      loginAlert.classList.remove('hidden', 'bg-red-950/40', 'border-red-600/40', 'text-red-300', 'bg-[#00f5a0]/10', 'border-[#00f5a0]/40', 'text-[#00f5a0]', 'bg-blue-950/40', 'border-blue-600/40', 'text-blue-300');
      loginAlert.innerText = msg;

      if (type === 'error') {
        loginAlert.classList.add('bg-red-950/40', 'border', 'border-red-600/40', 'text-red-300');
      } else if (type === 'success') {
        loginAlert.classList.add('bg-[#00f5a0]/10', 'border', 'border-[#00f5a0]/40', 'text-[#00f5a0]');
      } else {
        loginAlert.classList.add('bg-blue-950/40', 'border', 'border-blue-600/40', 'text-blue-300');
      }
    }

    // Если игрок уже авторизован, можно сразу предложить перейти на сайт
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('cloud_mine_auth_session') || sessionStorage.getItem('cloud_mine_auth_session');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.username) {
            inputUsername.value = parsed.username;
            inputUsername.dispatchEvent(new Event('input'));
            showAlert(`Обнаружена сохранённая сессия: ${parsed.username}. Введите пароль или перейдите на главную.`, 'info');
          }
        } catch(e) {}
      }
    });
  </script>
